<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToFM</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    />
    <link href="styles.css" rel="stylesheet" />

  <body class="text-center">
    <!-- FIXED 10-IMAGE COLLAGE BACKGROUND CONTAINER -->
    <div
      class="collage-bg-wrapper position-fixed top-0 start-0 vw-100 vh-100 overflow-hidden"
    >
      <!-- 'g-2' provides a crisp 0.5rem gap between tiles. Change to 'g-0' for zero gaps. -->
      <div class="row g-2 h-100">
        <!-- === ROW 1: TOP THIRD (3 Images) === -->
        <!-- Image 1 -->
        <div class="col-6 col-md-3 h-33">
          <div
            class="collage-cell w-100 h-100"
            style="background-image: url(&quot;./Assets/img1.webp&quot;)"
          ></div>
        </div>
        <!-- Image 2 -->
        <div class="col-6 col-md-6 h-33">
          <div
            class="collage-cell w-100 h-100"
            style="background-image: url(&quot;./Assets/img2.webp&quot;)"
          ></div>
        </div>
        <!-- Image 3 (Hidden on mobile to protect layout proportions) -->
        <div class="col-12 col-md-3 h-33 d-none d-md-block">
          <div
            class="collage-cell w-100 h-100"
            style="background-image: url(&quot;./Assets/img3.webp&quot;)"
          ></div>
        </div>

        <!-- Image 5 -->

        </div>
        <!-- Image 7 -->

          <div
            class="collage-cell w-100 h-100"
            style="background-image: url(&quot;./Assets/img7.webp&quot;)"
          ></div>
        </div>

        <!-- === ROW 3: BOTTOM THIRD (3 Images) === -->

      <header class="mb-auto">

          <nav class="nav fs-5 nav-masthead justify-content-center float-end">

            <a class="nav-link contact fw-bold py-1 px-0" href="./lesson.html"

      <main class="d-flex px-3 flex-column justify-content-center flex-grow-1">
        <section>
          <h1 class="pb-3 text-white">Tabernacle of Faith Ministries</h1>
          <p class="lead display-6">
